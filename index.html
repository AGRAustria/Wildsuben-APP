<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Wildstuben – Mein Abend</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#004b6b" />
</head>
<body>
  <header class="app-header">
    <h1>Wildstuben – 2026</h1>
    <h2>Mein Abend</h2>
    <p>Einfach auswählen – der Gesamtpreis rechnet sich von selbst.</p>
    <div class="total-box">
      Gesamt: <span id="total">0,00 €</span>
    </div>
  </header>

  <main>
    <section class="search-section">
      <input
        type="search"
        id="search"
        placeholder="Speise oder Getränk suchen …"
      />
    </section>

    <section class="tabs">
      <button class="tab-button active" data-category="getraenke">Getränke</button>
      <button class="tab-button" data-category="speisen">Speisen</button>
    </section>

    <section id="items-container"></section>
  </main>

  <footer class="app-footer">
    <small>Wildstuben – Digitale Speisekarte</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
