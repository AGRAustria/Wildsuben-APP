<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f241c">
<link rel="manifest" href="manifest.webmanifest">
<title>Wildstuben – Mein Abend</title>
<style>
:root{--brown:#2f241c;--cream:#fff8ea;--paper:#fffdf8;--gold:#d7a94b;--red:#9d2d24;--green:#31543a;--muted:#756b60;--line:#eadfcd;--shadow:0 12px 35px rgba(47,36,28,.12)}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:linear-gradient(180deg,#f4ead8 0,#fffaf0 35%,#f8efe1 100%);color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:680px;margin:auto;padding-bottom:110px}
.hero{padding:28px 18px 22px;background:var(--brown);color:#fff8ea;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:210px;height:210px;border-radius:50%;background:rgba(215,169,75,.18)}
.brand{font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
h1{margin:5px 0 4px;font-family:Georgia,serif;font-size:36px;line-height:1.05}
.subtitle{opacity:.86;font-size:14px}
.totalTop{margin-top:18px;display:flex;align-items:end;justify-content:space-between;gap:12px}
.totalTop strong{font-family:Georgia,serif;font-size:30px;color:#ffd978}
.totalTop span{font-size:12px;opacity:.75}
.search{padding:14px 16px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid #ddd1bd;border-radius:14px;padding:13px 15px;font-size:16px;outline:none;background:#fffaf2}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px 14px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid #dccdb5;background:#fffaf2;border-radius:999px;padding:9px 14px;font-weight:700;white-space:nowrap;color:var(--brown)}
.tab.active{background:var(--green);color:white;border-color:var(--green)}
.content{padding:8px 14px}
.sectionTitle{font-family:Georgia,serif;font-size:22px;margin:16px 4px 9px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin:9px 0;padding:13px 12px;box-shadow:0 5px 18px rgba(47,36,28,.05);display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-weight:750;font-size:15px;line-height:1.25} .meta{font-size:12px;color:var(--muted);margin-top:4px}
.price{font-weight:800;margin-top:6px;font-size:14px}
.controls{display:flex;align-items:center;gap:9px;flex:none}
.btn{width:38px;height:38px;border-radius:50%;border:1px solid #d8c7ad;background:#fff;font-size:22px;line-height:1;color:var(--brown);box-shadow:0 2px 5px rgba(0,0,0,.05)}
.qty{min-width:20px;text-align:center;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:45px 20px}
.receipt{margin:20px 14px 0;background:var(--brown);color:#fff8ea;border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.receipt h2{font-family:Georgia,serif;margin:0 0 12px;font-size:24px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px}
.grand{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:16px}
.grand strong{font-family:Georgia,serif;font-size:29px;color:#ffd978}
.split{margin-top:15px;background:rgba(255,255,255,.08);padding:12px;border-radius:16px}
.split label{font-size:12px;opacity:.8} .split input{width:75px;margin-left:8px;padding:8px;border-radius:9px;border:0;font-size:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.action{border:0;border-radius:13px;padding:12px;font-weight:800;background:#fff8ea;color:var(--brown)}
.action.danger{background:#ead7c4}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:18px 20px}
@media(max-width:390px){h1{font-size:32px}.card{padding:12px 10px}.name{font-size:14px}.btn{width:36px;height:36px}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="brand">Wildstuben · 2026</div>
  <h1>Mein Abend</h1>
  <div class="subtitle">Einfach auswählen – der Gesamtpreis rechnet sich von selbst.</div>
  <div class="totalTop"><span>Aktueller Gesamtbetrag</span><strong id="topTotal">0,00 €</strong></div>
</header>

<div class="search"><input id="search" type="search" placeholder="🔎  Speise oder Getränk suchen …"></div>
<nav class="tabs" id="tabs"></nav>
<main class="content" id="list"></main>

<section class="receipt">
  <h2>🧾 Meine Rechnung</h2>
  <div id="receiptRows"><div style="opacity:.7;font-size:14px">Noch nichts ausgewählt.</div></div>
  <div class="grand"><span>Gesamt</span><strong id="grandTotal">0,00 €</strong></div>
  <div class="split">
    <label>Auf wie viele Personen teilen?</label>
    <input id="people" type="number" min="1" max="99" value="1">
    <span id="perPerson" style="margin-left:8px;font-weight:800">0,00 € pro Person</span>
  </div>
  <div class="actions">
    <button class="action" id="share">↗ Teilen</button>
    <button class="action" id="copy">⧉ Kopieren</button>
    <button class="action danger" id="reset">↺ Alles löschen</button>
    <button class="action" id="install" style="display:none">＋ Zum Home-Bildschirm</button>
  </div>
</section>
<div class="footer">Alle Preise wie in der Wildstuben-Speisekarte 2026. Preise inkl. MwSt. und Servicepauschale.</div>
</div>

<script>
const MENU = [
      {cat:"Speisen",name:"Bayrisches Rindertatar",price:24.90},
      {cat:"Speisen",name:"Weißwürste",price:10.90},
      {cat:"Speisen",name:"Kürbissuppe vegan",price:9.50},
      {cat:"Speisen",name:"Obatzter",price:13.50},
      {cat:"Speisen",name:"Wiesn Brotzeit",price:19.90},
      {cat:"Speisen",name:"Wildstuben Schmankerlplatte",price:39.90,unit:"pro Person"},
      {cat:"Speisen",name:"Genießerbrettl",price:39.90,unit:"pro Person"},
      {cat:"Speisen",name:"Wildgulasch",price:27.90},
      {cat:"Speisen",name:"Wildschweinbraten",price:28.90},
      {cat:"Speisen",name:"Wildschweinhaxe",price:28.90},
      {cat:"Speisen",name:"Schweinekrustenbraten",price:23.90},
      {cat:"Speisen",name:"Wiener Schnitzel vom Kalb",price:31.50},
      {cat:"Speisen",name:"Rinderroulade",price:29.90},
      {cat:"Speisen",name:"Rinderbäckchen",price:30.90},
      {cat:"Speisen",name:"Kalbfleischpflanzerl",price:19.90},
      {cat:"Speisen",name:"Hirschkalbmedaillons",price:38.90},
      {cat:"Speisen",name:"Rehrücken",price:43.50},
      {cat:"Getränke",name:"Maß Spaten Oktoberfestbier",price:15.80},
      {cat:"Getränke",name:"Radlermaß",price:15.80},
      {cat:"Getränke",name:"Franziskaner Weißbier vom Fass",price:8.50},
      {cat:"Getränke",name:"Franziskaner Alkoholfreies Weißbier",price:8.50},
      {cat:"Getränke",name:"Softdrink",price:6.60},
      {cat:"Getränke",name:"Wasser",price:5.50},
      {cat:"Getränke",name:"Red Bull",price:6.80}
    ];
const euro = n => n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
let active = "Speisen", search = "", cart = {};
const tabs = document.getElementById('tabs'), list=document.getElementById('list');

const cats=[...new Set(MENU.map(x=>x.cat))];
function renderTabs(){
  tabs.innerHTML=cats.map(c=>`<button class="tab ${c===active?'active':''}" onclick="setCat('${c.replaceAll("'","\\'")}')">${c}</button>`).join("");
}
function setCat(c){active=c;renderTabs();renderList()}
function renderList(){
  const q=search.trim().toLowerCase();
  const items=MENU.filter(x=>x.cat===active && (!q || x.name.toLowerCase().includes(q)));
  if(!items.length){list.innerHTML='<div class="empty">Nichts gefunden.</div>';return}
  list.innerHTML='<div class="sectionTitle">'+active+'</div>'+items.map((x,i)=>{
    const key=x.name.replaceAll('"','&quot;');
    const qty=cart[x.name]||0;
    return `<div class="card">
      <div><div class="name">${x.name}</div><div class="meta">${x.unit||''}</div><div class="price">${euro(x.price)}</div></div>
      <div class="controls"><button class="btn" onclick="change('${key}',-1)">−</button><div class="qty">${qty}</div><button class="btn" onclick="change('${key}',1)">+</button></div>
    </div>`;
  }).join("");
}
function change(name,delta){cart[name]=Math.max(0,(cart[name]||0)+delta);if(cart[name]===0)delete cart[name];renderList();renderReceipt();}
function renderReceipt(){
  let total=0, html="";
  for(const [name,qty] of Object.entries(cart)){
    const item=MENU.find(x=>x.name===name); if(!item) continue;
    const sum=item.price*qty; total+=sum;
    html+=`<div class="row"><span>${qty} × ${name}</span><b>${euro(sum)}</b></div>`;
  }
  document.getElementById('receiptRows').innerHTML=html||'<div style="opacity:.7;font-size:14px">Noch nichts ausgewählt.</div>';
  document.getElementById('grandTotal').textContent=euro(total);
  document.getElementById('topTotal').textContent=euro(total);
  const p=Math.max(1,parseInt(document.getElementById('people').value)||1);
  document.getElementById('perPerson').textContent=euro(total/p)+" pro Person";
}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;renderList()});
document.getElementById('people').addEventListener('input',renderReceipt);
document.getElementById('reset').onclick=()=>{cart={};renderList();renderReceipt()};
function receiptText(){
 let lines=["Wildstuben – meine Rechnung",""];
 let total=0;
 for(const [name,qty] of Object.entries(cart)){
   const item=MENU.find(x=>x.name===name); if(!item)continue;
   const sum=item.price*qty;total+=sum;lines.push(`${qty} × ${name} – ${euro(sum)}`);
 }
 lines.push("",`Gesamt: ${euro(total)}`);
 const p=Math.max(1,parseInt(document.getElementById('people').value)||1);
 if(p>1)lines.push(`Bei ${p} Personen: ${euro(total/p)} pro Person`);
 return lines.join("\n");
}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(receiptText());alert("Rechnung wurde kopiert.");}catch(e){alert(receiptText())}};
document.getElementById('share').onclick=async()=>{if(navigator.share){await navigator.share({title:"Wildstuben – meine Rechnung",text:receiptText()})}else{document.getElementById('copy').click()}};
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install').style.display='block'});
document.getElementById('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}};
renderTabs();renderList();renderReceipt();
</script>
</body>
</html>
